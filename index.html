<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>1879: Guerra del Pacífico</title>
<meta name="description" content="Shooter en primera persona sobre la Guerra del Pacífico (1879-1880), con un motor de arquitectura DOOM escrito en JavaScript: Pisagua, Dolores y el Morro de Arica.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #game { box-sizing: border-box; height: 100%; padding-inline: 16px; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #boot {
    position: fixed; inset: 0; margin: 0; padding: 12px 16px; box-sizing: border-box; overflow: auto;
    background: #000; color: #b8b8b8; font: 14px/1.35 "Courier New", Courier, monospace; white-space: pre-wrap; z-index: 5;
  }
  #boot::first-line { color: #fff; background: #7a1c14; }
  #touch { position: fixed; inset: 0; display: none; z-index: 4; pointer-events: none; -webkit-user-select: none; user-select: none; }
  #touch > * { pointer-events: auto; position: absolute; box-sizing: border-box; }
  #t-look { right: 0; top: 0; width: 55%; height: 100%; }
  #t-stick { left: max(16px, env(safe-area-inset-left)); bottom: 20px; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(240, 230, 200, 0.12); border: 2px solid rgba(240, 230, 200, 0.35); }
  #t-knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: rgba(240, 230, 200, 0.35); border: 2px solid rgba(255, 255, 255, 0.5); pointer-events: none; }
  .t-btn { border-radius: 50%; background: rgba(240, 230, 200, 0.14); border: 2px solid rgba(240, 230, 200, 0.4);
    color: rgba(255, 250, 235, 0.85); font: bold 13px/1 sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; }
  .t-btn.on { background: rgba(214, 60, 40, 0.45); }
  #t-fire { right: max(18px, env(safe-area-inset-right)); bottom: 28px; width: 104px; height: 104px; font-size: 15px; }
  #t-use { right: 136px; bottom: 22px; width: 64px; height: 64px; }
  #t-aim { right: 136px; bottom: 100px; width: 64px; height: 64px; }
  #t-weap { right: 34px; bottom: 150px; width: 64px; height: 64px; }
  #t-map { right: 16px; top: 16px; width: 52px; height: 52px; font-size: 11px; }
  #t-menu { left: 16px; top: 16px; width: 52px; height: 52px; font-size: 11px; }
</style>
</head>
<body>
<div id="game"><canvas id="screen" tabindex="0" aria-label="Pantalla del juego"></canvas></div>
<pre id="boot" aria-live="polite"></pre>
<div id="touch" aria-hidden="true">
  <div id="t-look"></div>
  <div id="t-stick"><div id="t-knob"></div></div>
  <div id="t-fire" class="t-btn">FUEGO</div>
  <div id="t-aim" class="t-btn">MIRA</div>
  <div id="t-use" class="t-btn">USAR</div>
  <div id="t-weap" class="t-btn">ARMA</div>
  <div id="t-map" class="t-btn">MAPA</div>
  <div id="t-menu" class="t-btn">MENÚ</div>
</div>
<noscript><p style="color:#ccc;font-family:monospace">Este juego necesita JavaScript.</p></noscript>

<script>
  window.addEventListener('load', function () {
    D_DoomMain().catch(function (e) {
      const el = document.getElementById('boot');
      if (el) { el.style.display = 'block'; el.textContent += '\nERROR: ' + (e && e.stack || e) + '\n'; }
      console.error(e);
    });
  });
