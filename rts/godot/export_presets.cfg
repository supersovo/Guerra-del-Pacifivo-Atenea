; Exportación del cliente 3D para Windows, macOS y Linux (siempre en modo release).
; Lo usa herramientas/exportar_cliente3d.py, que la integración continua corre en Linux
; para los tres sistemas; los guiones de instalador/ juntan el resultado con los
; ejecutables de PyInstaller (la versión clásica y el servidor) y sus datos.
; Las opciones que no figuran aquí quedan con su valor por omisión.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="datos/*.json"
exclude_filter=""
export_path="../dist/cliente3d/windows/GuerraDelPacifico.exe"

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
codesign/enable=false
application/modify_resources=true
application/company_name="Proyecto Atenea"
application/product_name="Guerra del Pacífico: Salitre y Pólvora"
application/file_description="Guerra del Pacífico: Salitre y Pólvora"
application/copyright="Proyecto Atenea"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="datos/*.json"
exclude_filter=""
export_path="../dist/cliente3d/macos/GuerraDelPacifico.zip"

[preset.1.options]

binary_format/architecture="universal"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
application/bundle_identifier="cl.proyectoatenea.guerradelpacifico"
application/app_category="Strategy-games"
application/copyright="Proyecto Atenea"
codesign/codesign=1
notarization/notarization=0

[preset.2]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="datos/*.json"
exclude_filter=""
export_path="../dist/cliente3d/linux/GuerraDelPacifico"

[preset.2.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
